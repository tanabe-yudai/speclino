[project]
name = "speclino"
version = "0.1.0"
description = "仕様とコードの意味差分をエージェントと決定的な検査器で検証する"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.133",
  "uvicorn[standard]",
  "pydantic>=2.10",
  "pydantic-settings",
  "z3-solver>=5.1",
  "google-adk>=2.9,<2.10",
  "google-genai>=2.19,<3",
  "sqlalchemy[asyncio]>=2.0",
  "alembic",
  "asyncpg",
  "httpx",
  "pyyaml",
  "jsonschema",
  "typer",
  "PyJWT[crypto]",
  "structlog",
  "mcp>=2,<3",
  "google-cloud-tasks>=2,<3",
  "google-cloud-storage>=2,<4",
]

[project.scripts]
speclino = "speclino.cli:app"

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "respx",
  "types-PyYAML",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speclino"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Golden の変異コードは意図的に壊した実装なので lint 対象外
extend-exclude = ["eval/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI / typer の依存注入は引数既定値で呼ぶのが慣例
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["z3", "z3.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: 実LLMを呼ぶ（CI除外）",
  "spec(id): SpecLino 自身の仕様IDに対応するテスト",
  "integration: 実DBが必要な統合テスト（SPECLINO_DATABASE_URL 未設定なら skip）",
  "selfcheck: SpecLino を現在のリポジトリ自身に当てる検証。デモブランチでは落ちるのが正しい",
]

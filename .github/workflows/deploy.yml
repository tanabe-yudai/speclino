name: Deploy

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "design/**"

permissions:
  id-token: write
  contents: read

env:
  REGION: asia-northeast1
  REPOSITORY: speclino
  IMAGE_NAME: speclino

jobs:
  deploy:
    # GCP 骨組み（S12）の apply 後に repository variable DEPLOY_ENABLED=true を設定するまで、
    # push では走らせない（secrets が無い状態で失敗し続けるのを避ける）
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # WIF: infra/envs/prod/wif.tf の workload identity pool / provider と
      # deployer サービスアカウントを使う。長期キーは持たない。
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SHA: ${{ github.sha }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          # 空のままビルドすると、画面が「開発モードで入る」になり本番でログインできない
          # （2026-09-28 に実際に起きた）。本番のイメージでは必ず止める。
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::repository variable ${name} が未設定（本番の画面がログインできなくなる）"
              exit 1
            fi
          done
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          # Firebase の設定は Vite がビルド時に埋め込む（実行時の env では効かない）。
          # 値は公開前提のクライアント設定（秘密ではない）。
          docker build -t "${IMAGE}" \
            --build-arg "VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}" \
            --build-arg "VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}" \
            --build-arg "VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}" \
            .

      - name: Push image
        run: docker push "${IMAGE}"

      # Terraform の `image` 変数は書き換えない運用にしている
      # （infra/envs/prod/run.tf の lifecycle.ignore_changes 参照）。
      # デプロイのたびに terraform apply を要求すると、
      # plan/apply の承認フローを毎回挟む必要があり CI/CD の速度と
      # 「apply はユーザー確認後」という運用ルールが両立しないため、
      # イメージ更新だけは `gcloud run services update` で直接反映する。
      # サービスを更新する前にマイグレーションを流す（infra/envs/prod/run.tf の
      # google_cloud_run_v2_job.migrate）。失敗したらサービスは旧イメージのまま止める。
      - name: Migrate database
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run jobs update speclino-migrate \
            --project="${GCP_PROJECT_ID}" --region="${REGION}" --image="${IMAGE}"
          gcloud run jobs execute speclino-migrate \
            --project="${GCP_PROJECT_ID}" --region="${REGION}" --wait

          # speclino-admin（ワークスペース管理 CLI、S53）のイメージを更新し、サービスを更新する前に
          # 既存 project のリポジトリ ID を埋める（backfill-repo-ids は ID が NULL の行だけを見るので
          # 毎回流してよい）。新しい webhook の処理は ID の無い同名の行を別リポジトリとして退避するため、
          # 埋める前に新しいサービスが webhook を受けると、既存 project が設定ごと退避される。
          # 失敗したらサービスは旧イメージのまま止める。
          # Job が無いときは飛ばさずに止める（先に terraform apply で作る。guides/deploy-runbook.md 9 章）。
          gcloud run jobs update speclino-admin \
            --project="${GCP_PROJECT_ID}" --region="${REGION}" --image="${IMAGE}"
          gcloud run jobs execute speclino-admin \
            --project="${GCP_PROJECT_ID}" --region="${REGION}" --wait \
            --args=workspace,backfill-repo-ids

      - name: Deploy to Cloud Run (web / worker / sandbox)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # speclino-sandbox は Terraform の enable_sandbox が true のときだけ存在する（S38）。
          # 無いものを更新しようとして deploy 全体を落とさないよう、存在するものだけ更新する。
          for SERVICE in speclino-web speclino-worker speclino-sandbox; do
            if ! gcloud run services describe "${SERVICE}" \
                 --project="${GCP_PROJECT_ID}" --region="${REGION}" >/dev/null 2>&1; then
              echo "${SERVICE} は存在しないので飛ばす"
              continue
            fi
            gcloud run services update "${SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${REGION}" \
              --image="${IMAGE}"
          done

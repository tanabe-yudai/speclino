name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: speclino
          POSTGRES_PASSWORD: speclino
          POSTGRES_DB: speclino
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U speclino" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPECLINO_DATABASE_URL: postgresql+asyncpg://speclino:speclino@localhost:5432/speclino
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups
      - run: make lint
      - run: uv run alembic upgrade head
      - run: make test
      - run: make eval
      # 自己検証: SpecLino 自身の仕様（SPEC-TOOL-001 / SPEC-GATE-001 / SPEC-RUN-001）と規約
      # （MAKE-001 / SPEC-FMT-001 / CI-001 / API-ERR-001）
      - run: uv run speclino check --repo . --head WORKTREE --out build/self-check --fail-on VIOLATED --fail-on UNKNOWN --fail-on REVIEW --blocking

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR へのコメントと要約の投稿には pull-requests / issues の write が要るが、
          # 規約 CI-001 は読取り専用の権限しか許さない。検出結果はジョブのログと
          # 終了コードで分かるので、API を叩く付加機能は切る（403 で失敗しなくなる）。
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

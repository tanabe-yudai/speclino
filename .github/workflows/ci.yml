name: CI

# push と pull_request の両方を無条件に受けると、PR のあるブランチで全ジョブが 2 回走る。
# ブランチへの push は PR 側で検査されるので、push は main（マージ後の確認）だけにする。
on:
  push:
    branches: [main]
  pull_request:

# 同じ ref に新しい push が来たら、走っている実行を打ち切る（古い結果を待たない）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ジョブは言語ではなく**検査の段階**で分ける。失敗したジョブ名を見ただけで
# 「書式なのか・型なのか・テストなのか・仕様との差分なのか」が分かるようにする。
permissions:
  contents: read
  # gitleaks は PR のコミット一覧（GET /repos/.../pulls/{n}/commits）を読んで差分を絞る。
  # 読取りだけなので規約 CI-001（書込み権限の禁止）には反しない。
  pull-requests: read

jobs:
  lint:
    name: lint (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - run: make lint

  typecheck:
    name: typecheck (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - run: make typecheck

  test:
    name: test (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: speclino
          POSTGRES_PASSWORD: speclino
          POSTGRES_DB: speclino
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U speclino" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPECLINO_DATABASE_URL: postgresql+asyncpg://speclino:speclino@localhost:5432/speclino
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - run: uv run alembic upgrade head
      - run: make test

  self-check:
    name: self-check (cli, no agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      # SpecLino 自身の仕様（SPEC-TOOL-001 / SPEC-GATE-001 / SPEC-RUN-001 / SPEC-TEST-002）と規約
      # （MAKE-001 / SPEC-FMT-001 / CI-001 / API-ERR-001）を、**CLI だけで**検査する
      # （pytest 側の selfcheck マーカーのテストも合わせて実行する。`make selfcheck` 参照）。
      #
      # PR に出る `SpecLino / gate` は同じ判定を本番（Cloud Run）で出すが、あちらは
      # GCP・DB・GitHub App が生きていることに依存し、エージェントと base 差分も含む。
      # こちらはリポジトリだけで完結するので、GCP を畳んだ後や clone した人の手元でも動き、
      # 「LLM を使わずに決定的解析だけで違反を検出できる」ことの裏付けにもなる。
      - run: make selfcheck

  lint-frontend:
    name: lint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: npm run lint
        working-directory: web

  typecheck-frontend:
    name: typecheck (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: npm run typecheck
        working-directory: web

  test-frontend:
    name: test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: npm test
        working-directory: web

  build-frontend:
    name: build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: npm run build
        working-directory: web

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR コメントとジョブ要約の投稿には write が要るが、CI-001 は読取り専用しか
          # 許さない。検出結果は終了コードとログで分かるので付加機能は切る。
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

name: setup-frontend
description: フロントエンド（Node / npm）の依存を用意する（ステージごとのジョブで共通）
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: web/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: web

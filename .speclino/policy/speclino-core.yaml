schema_version: "0.1"
id: speclino-core
version: "1.0.0"
status: active
owner: tanabe-yudai

rules:
  - id: MAKE-001
    version: "1.0.0"
    level: mandatory
    title: "Makefile の標準ターゲットは実処理を持つこと"
    text: >
      setup / test / lint の各ターゲットが定義され、レシピが空または trivial のみでないこと。
      ターゲットの存在だけで実処理の成立とはしない（AC-004）。
    applies_to:
      paths:
        - Makefile
      languages: []
    source:
      doc: .speclino/specs/spec-sys-001.md
      anchor: "4. 要求"
    verifier:
      id: makefile.required_targets
      version: "1.0.0"
      params:
        targets: [setup, test, lint]
        trivial: ["true", ":", "@true", "echo *"]
    on_missing_input: violation
    exceptions_allowed: true

  - id: SPEC-FMT-001
    version: "1.0.0"
    level: mandatory
    title: "仕様 Markdown は要求 ID と必須節を持つこと"
    text: >
      specs/*.md は `### <ID>` 見出し（または front matter の id）で要求 ID を1つ以上宣言し、
      必須節（前提・要求・観測境界）を欠かさず、要求 ID を重複させないこと（AC-002）。
    applies_to:
      paths:
        - "specs/*.md"
      languages: []
    source:
      doc: .speclino/specs/spec-sys-001.md
      anchor: "4. 要求"
    verifier:
      id: spec.required_sections
      version: "1.0.0"
      params:
        id_pattern: "^R-[A-Z]+-\\d+[a-z]?$"
        required_sections:
          - "## 前提"
          - "## 要求"
          - "## 観測境界"
    on_missing_input: unknown
    exceptions_allowed: true

  - id: SPEC-TEST-001
    version: "1.0.0"
    level: advisory
    title: "@pytest.mark.spec と Spec IR の tests は一致すること"
    text: >
      Spec IR（specs/ir/*.spec-ir.json）の rules[].tests に宣言したテスト ID は実在する
      ファイル::関数を指し、@pytest.mark.spec("R-...") の付いたテストは対応する rule.tests
      に宣言されていること。二重管理（Spec IR の tests とテストのマーカー）がずれると
      test_run が no_declared_tests で何もしなくなる（S38）。このリポジトリの仕様の正本は
      SpecLino にあり specs/ir を置かないので、マーカーも付けない。advisory のまま残す。
    applies_to:
      paths:
        - "specs/ir/*.spec-ir.json"
        - "tests/**/test_*.py"
      languages: []
    source:
      doc: .speclino/specs/spec-know-001.md
    verifier:
      id: spec_tests
      version: "1.0.0"
      params:
        spec_ir_paths:
          - "specs/ir/*.spec-ir.json"
        test_paths:
          - "tests/**/test_*.py"
        marker: spec
    on_missing_input: unknown
    exceptions_allowed: true

  - id: CI-001
    version: "1.0.0"
    level: mandatory
    title: "CI ワークフローは pull_request で lint/test を必須にし、権限を読み取りに絞ること"
    text: >
      .github/workflows/ci.yml は pull_request トリガーを持ち、make lint / make test を
      必須ステップとして実行し、pull_request_target イベントを使わず、トップレベル
      permissions を宣言して書込み権限を含まないこと。
    applies_to:
      paths:
        - ".github/workflows/ci.yml"
      languages: []
    source:
      doc: .speclino/specs/spec-sys-001.md
      anchor: "4. 要求"
    verifier:
      id: ci.required_conditions
      version: "1.0.0"
      params:
        require_pull_request_trigger: true
        # 段階ごとのジョブに分かれていても、run の 1 行として現れていればよい
        required_steps: ["make lint", "make typecheck", "make test"]
        forbid_events: ["pull_request_target"]
        require_read_permissions: true
        allowed_write_permissions: ["id-token"]
    on_missing_input: violation
    exceptions_allowed: true

  - id: API-ERR-001
    version: "1.0.0"
    level: advisory
    title: "API のエラー応答は共通形式（ErrorResponse）で、ヘルパー経由で送出すること"
    text: >
      openapi.json の 4xx/5xx responses は #/components/schemas/ErrorResponse を参照し、
      src/speclino/api 配下のソースは HTTPException(...) を直接 raise せず api_error(...)
      ヘルパー経由で送出すること。既存ルートの置換前のため advisory とし、ゲートは落とさない。
    applies_to:
      paths:
        - "openapi.json"
        - "src/speclino/api/**/*.py"
      languages: []
    source:
      doc: .speclino/specs/spec-sys-001.md
      anchor: "4. 要求"
    verifier:
      id: api.error_format
      version: "1.0.0"
      params:
        openapi_path: openapi.json
        error_schema: ErrorResponse
        api_glob: "src/speclino/api/**/*.py"
        helper_symbol: api_error
    on_missing_input: unknown
    exceptions_allowed: true

  # ---- 構成の規約（S60）。CLAUDE.md から移した。検証器が無いので助言（advisory）で、
  # 判定は作らない（VerifierRegistry._run_rule）。エージェントは MCP の context_get でも読める。
  - id: ARCH-001
    version: "1.0.0"
    level: advisory
    title: "domain/ には型定義だけを置き、ロジックを書かないこと"
    text: >
      src/speclino/domain/ は pydantic モデルと enum の型定義だけを置く。振る舞いは services/・
      conformance/・analysis/ などに書く。schemas/*.schema.json は domain/ のモデルから生成し、
      手で編集しない。
    applies_to:
      paths:
        - "src/speclino/domain/**/*.py"
        - "schemas/*.schema.json"
      languages: []
    source:
      doc: CLAUDE.md
      anchor: "構成と規約"
    on_missing_input: unknown
    exceptions_allowed: true
  - id: ARCH-002
    version: "1.0.0"
    level: advisory
    title: "検査器（conformance/）と解析器（analysis/）は LLM と adapters に依存しないこと"
    text: >
      src/speclino/conformance/ と src/speclino/analysis/ は google.*・speclino.agent・
      speclino.adapters を import しない。手書きの IR だけで単体試験できること。判定は決定的な
      検査器だけが行い、LLM の出力で判定を変えない。
    applies_to:
      paths:
        - "src/speclino/conformance/**/*.py"
        - "src/speclino/analysis/**/*.py"
      languages: []
    source:
      doc: CLAUDE.md
      anchor: "構成と規約"
    on_missing_input: unknown
    exceptions_allowed: true
  - id: ARCH-003
    version: "1.0.0"
    level: advisory
    title: "ビジネスロジックを api/ と web/ に置かず、TypeScript の型は web/src/types/ に分けること"
    text: >
      ビジネスロジックは services/・conformance/・analysis/ に集約し、src/speclino/api/ と web/ の
      画面には置かない。web の処理は web/src/services/ に、型は web/src/types/ に置く。
    applies_to:
      paths:
        - "src/speclino/api/**/*.py"
        - "web/src/**/*.ts"
        - "web/src/**/*.tsx"
      languages: []
    source:
      doc: CLAUDE.md
      anchor: "構成と規約"
    on_missing_input: unknown
    exceptions_allowed: true
  - id: ARCH-004
    version: "1.0.0"
    level: advisory
    title: "静的解析で対象リポジトリのモジュールを import せず、IR の式を eval しないこと"
    text: >
      解析は対象リポジトリのソースを読むだけにし、モジュールを import して実行しない。IR の式は
      解釈器で評価し、Python の eval / exec に渡さない。
    applies_to:
      paths:
        - "src/speclino/**/*.py"
      languages: []
    source:
      doc: CLAUDE.md
      anchor: "構成と規約"
    on_missing_input: unknown
    exceptions_allowed: true
  - id: VERDICT-001
    version: "1.0.0"
    level: advisory
    title: "判定は 4 値を正直に保ち、ゲートはフェイルクローズにすること"
    text: >
      判定は VERIFIED_IN_SCOPE / VIOLATED / UNKNOWN / REVIEW の 4 値。解析できないものを違反と
      表示せず、適合とも表示しない。ゲートは必須ルールに UNKNOWN / REVIEW が残れば失敗にする。
    applies_to:
      paths:
        - "src/speclino/**/*.py"
        - "web/src/**/*.ts"
        - "web/src/**/*.tsx"
      languages: []
    source:
      doc: CLAUDE.md
      anchor: "構成と規約"
    on_missing_input: unknown
    exceptions_allowed: true
  - id: ARCH-005
    version: "1.0.0"
    level: advisory
    title: "解析器・モデル・コードホストなどの外部は ports/ と adapters/ の境界で差し替えられること"
    text: >
      解析器・LLM（モデル）・コードホスト（GitHub）・成果物の保存先・タスクキュー・sandbox は
      src/speclino/ports/ の型（Protocol）で受け、具体的な実装は src/speclino/adapters/ に置く。
      conformance/・analysis/ は adapters/ を import しない（ARCH-002）。services/ は ports/ の型に依存し、
      adapters/ の具体的なクラスを作るのは起動時の組み立て（依存の注入）に限る。いまの例外
      （services/repo_registration.py の GitHub の OAuth、services/review_run_service.py の Check の対応表）は
      増やさない。外部の差し替えでドメインと検査器を作り直さないため
      （製品の非機能要求 NFR-008「解析器・モデル・仕様保存先・コード接続先をアダプタ境界で交換可能にする」）。
    applies_to:
      paths:
        - "src/speclino/ports/**/*.py"
        - "src/speclino/adapters/**/*.py"
        - "src/speclino/services/**/*.py"
        - "src/speclino/conformance/**/*.py"
        - "src/speclino/analysis/**/*.py"
      languages: []
    source:
      doc: .speclino/specs/spec-sys-001.md
      anchor: "3. 構成要素と責務"
    on_missing_input: unknown
    exceptions_allowed: true
  - id: UI-001
    version: "1.0.0"
    level: advisory
    title: "画面の判定の色と用語は固定し、決まった規則で並べ、個人の環境の値と「デモ」を書かないこと"
    text: >
      判定の 4 値（適合 / 違反 / 未検証 / 要確認）の色はデザイントークン（web/src/styles/globals.css）に、
      用語は web/src/services/labels.ts と knowledge.ts に固定し、画面ごとに色や言い換えを作らない。
      「次にやること」などの並びは検査結果から決まった規則（web/src/services/nextActions.ts）で作り、
      LLM で作らない。個人の環境の値（実在のアカウント名・リポジトリ名・URL・メール・プロジェクト ID）を
      画面と文書に書かず、例は example-org/... や置き換え記号にする。画面・文書・ページのタイトルに
      「デモ」という言葉を使わず、サービスとして書く。
    applies_to:
      paths:
        - "web/src/**/*.ts"
        - "web/src/**/*.tsx"
        - "web/src/styles/*.css"
        - "web/index.html"
      languages: []
    source:
      doc: .speclino/specs/spec-sys-001.md
      anchor: "3. 構成要素と責務（Web）"
    on_missing_input: unknown
    exceptions_allowed: true

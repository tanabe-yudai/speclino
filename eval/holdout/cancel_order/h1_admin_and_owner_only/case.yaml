id: h1_admin_and_owner_only
title: 認可条件を is_admin and is_owner にする
description: >-
  認可条件を「管理者 OR 所有者」から「管理者 AND 所有者」に変える。所有者だけ（管理者ではない）
  はもちろん、管理者だけ（所有者ではない）の利用者も 403 で拒否されるようになる。仕様の
  applicability（authorized = is_admin OR is_owner）の一部（純粋な管理者、または純粋な所有者）が
  実装の 403 経路（p1_403）と重なるため、認可された利用者を前提とする要求
  （R-CANCEL-02〜06）が軒並み違反になる。holdout（調整に使わない検証用）ケースであり、
  `make eval` には含めない。
expected:
  R-CANCEL-01:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-02:
    verdict: VIOLATED
    category: outcome_mismatch
  R-CANCEL-03:
    verdict: VIOLATED
    category: state_mismatch
  R-CANCEL-04:
    verdict: VIOLATED
    category: missing_effect
  R-CANCEL-05:
    verdict: VIOLATED
    category: missing_effect
  R-CANCEL-06:
    verdict: VIOLATED
    category: constraint_mismatch
  R-CANCEL-07a:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-07b:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-07c:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
counterexample_must_include:
  R-CANCEL-02:
    path_id: p1_403
    assignments:
      before.actor.is_admin: true
  R-CANCEL-03:
    path_id: p1_403
    assignments:
      before.actor.is_admin: false
      before.order.status: PENDING
  R-CANCEL-04:
    path_id: p1_403
    assignments: {}
  R-CANCEL-05:
    path_id: p1_403
    assignments: {}
  R-CANCEL-06:
    path_id: p1_403
    assignments:
      before.actor.is_admin: false
      before.order.status: PENDING

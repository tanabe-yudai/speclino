id: h2_audit_removed
title: 監査を呼ばない
description: >-
  成功経路から audit.record（監査記録コマンド）の呼出しを削除する。R-CANCEL-05（監査記録を
  1 回呼ぶ）のみ missing_effect になる。他の要求は影響を受けない。holdout（調整に使わない
  検証用）ケースであり、`make eval` には含めない。

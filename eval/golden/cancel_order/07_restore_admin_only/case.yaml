id: 07_restore_admin_only
title: 在庫復元を管理者経路だけで呼ぶ
description: 'inventory.restore を `if user.is_admin:` で管理者経路だけに限定する。所有者経路（p4_owner: not is_admin, is_owner,
  PENDING）で呼出しが 0 回になり R-CANCEL-04 が missing_effect。これは回数（構造的）違反であり Z3 モデルを使わないため counterexample.assignments
  は空になる — 「所有者のみの反例」を示す実際の証拠は counterexample.path_id（p4_owner）と、そのガードの記述（not(before.actor.is_admin) を含む）であり、assignments
  辞書には現れない。この点は「呼出しなしの根拠は経路が完全な場合に限る」という設計と整合する。'
expected:
  R-CANCEL-01:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-02:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-03:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-04:
    verdict: VIOLATED
    category: missing_effect
  R-CANCEL-05:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-06:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-07a:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-07b:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-07c:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
counterexample_must_include:
  R-CANCEL-04:
    path_id: p4_owner
    assignments: {}

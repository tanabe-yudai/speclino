id: 18_loop_in_path
title: 関連経路に対応外ループがある
description: >-
  成功経路で `inventory.restore(order.items)` の代わりに `for item in order.items:
  inventory.restore(item)` を使う。`ast.For` は PoC 3.2 の対応構文に無い。構造解析（S29）が
  ループ領域を走査し「触れ得る観測は在庫復元の呼出しだけ（return / raise / 束縛変数の書込み
  は無い）」と分かるので、経路は不完全（precision=incomplete、may_affect=[call:inventory_restore_command]）
  のまま後続の audit.record / return まで追跡する。在庫復元の回数に関わる R-CANCEL-04 だけが
  UNKNOWN（unsupported_analysis）になり、状態（03）・監査の回数と引数（05/06）はループが
  触れないので VERIFIED_IN_SCOPE（構造解析による不在証明）。拒否経路に関連する
  R-CANCEL-01/02/07a/07b/07c はこの文に到達しないため影響を受けない。
expected:
  R-CANCEL-01:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-02:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-03:
    verdict: VERIFIED_IN_SCOPE
    category: conformant
  R-CANCEL-04:

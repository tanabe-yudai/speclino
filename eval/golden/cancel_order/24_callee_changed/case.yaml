id: 24_callee_changed
title: 呼び出し先だけを変更する
description: >-
  15_helper_split（`_finish(order, user)` に在庫復元・監査記録を分割した実装）を基に、
  `cancel_order` 自体は 1 行も変えず `_finish` の中身（在庫復元の呼出し）だけを削除する。
  呼出し元のコード差分がゼロでも、`_finish` を経由して展開される Code IR の在庫復元イベントが
  消えるため、`_finish` に依存する入口の要求（R-CANCEL-04）を再評価すると missing_effect に
  なる。PoC 12.2「変更行に要求 ID を紐付けるだけでは不十分。変更されたヘルパーに依存する入口の
  要求も再評価する」を確認する。監査記録（R-CANCEL-05）は `_finish` に残っているため影響を
  受けない。

<title>SpecLino — 概要</title>
<style>

    background: #ffffff;
    overflow: hidden;
  }
  body {

  }
  svg text {
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
  }
</style>
</head>
<body>
<figure style="margin:0;">
  <svg width="1600" height="900" viewBox="0 0 1600 900" role="img"
       aria-label="SpecLinoは承認済み仕様とコードを中間表現に変換し、決定的な検査器Z3が要求ごとにVERIFIED_IN_SCOPE・VIOLATED・UNKNOWN・REVIEWの4値を反例つきで判定し、未解決が残ればゲートで失敗させる。未解決のときだけADKエージェントが証拠を集めるが、判定そのものは書き換えられない。">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#14213d"/>
      </marker>
      <marker id="arrowGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/>
      </marker>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#c5221f"/>
      </marker>
    </defs>

    <!-- background -->
    <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

    <!-- ===================== HEADER ===================== -->
    <text x="40" y="46" font-size="28" font-weight="700" fill="#14213d">SpecLino — 仕様とコードの意味差分を、反例つきで示す</text>
    <text x="40" y="75" font-size="15" fill="#5b6472">仕様（Markdown）とコードを共通語彙の中間表現に変換し、決定的な検査器（Z3）で「どの要求が・どの条件で・どう破られるか」を出す</text>
    <line x1="40" y1="94" x2="1560" y2="94" stroke="#dde2ea" stroke-width="1.5"/>

    <!-- ===================== BAND B: MAIN PIPELINE ===================== -->

    <!-- INPUT label -->
    <text x="40" y="122" font-size="12" font-weight="700" fill="#5b6472" letter-spacing="1">入力</text>

    <!-- INPUT 1: spec -->
    <rect x="40" y="128" width="220" height="58" rx="10" fill="#ffffff" stroke="#c7ccd6" stroke-width="1.5"/>
    <text x="55" y="152" font-size="13.5" font-weight="700" fill="#14213d">仕様（specs/*.md）</text>
    <text x="55" y="173" font-size="12.5" fill="#14213d">→ Spec IR</text>

    <!-- INPUT 2: code -->
    <rect x="40" y="200" width="220" height="104" rx="10" fill="#ffffff" stroke="#c7ccd6" stroke-width="1.5"/>
    <text x="55" y="222" font-size="13.5" font-weight="700" fill="#14213d">コード（Python）</text>
    <text x="55" y="242" font-size="12" fill="#14213d">→ path_analyzer</text>
    <text x="55" y="261" font-size="12" fill="#14213d">→ Code IR</text>
    <text x="55" y="281" font-size="10.5" fill="#5b6472">経路ごとの条件・状態・</text>
    <text x="55" y="294" font-size="10.5" fill="#5b6472">呼出しを持つ</text>

    <!-- arrows: input -> checker -->
    <line x1="260" y1="157" x2="318" y2="210" stroke="#14213d" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="260" y1="252" x2="318" y2="228" stroke="#14213d" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- CHECKER -->
    <rect x="320" y="120" width="220" height="200" rx="10" fill="#eaf1fd" stroke="#1a73e8" stroke-width="2"/>
    <text x="336" y="150" font-size="15" font-weight="700" fill="#0b4bb0">決定的な検査器</text>
    <text x="336" y="171" font-size="12.5" fill="#0b4bb0">（Z3 / SMTソルバー）</text>
    <text x="336" y="199" font-size="12.5" font-weight="700" fill="#0b4bb0" class="mono">前提 ∧ 経路条件 ∧ ¬期待</text>
    <text x="336" y="221" font-size="11" fill="#3a4a63">を要求 × 経路ごとに解く</text>
    <text x="336" y="238" font-size="11" fill="#3a4a63">（充足可能性判定）</text>

    <text x="614" y="143" font-size="12" font-weight="700" fill="#1e6b34" class="mono">VERIFIED_IN_SCOPE</text>
    <text x="614" y="160" font-size="10" fill="#1e6b34">観測範囲内で全経路が成立</text>

    <!-- chip: VIOLATED -->
    <rect x="604" y="177" width="222" height="46" rx="8" fill="#fdecea" stroke="#c5221f" stroke-width="1.4"/>

    <text x="614" y="302" font-size="12" font-weight="700" fill="#17469e" class="mono">REVIEW</text>
    <text x="614" y="319" font-size="10" fill="#17469e">人の確認が必要（未承認解釈等）</text>

    <!-- footer -->
    <text x="40" y="852" font-size="11" fill="#8a93a6">※ 本図は概念図。本番のインフラ構成は design/architecture.png を参照。</text>
  </svg>
  <figcaption class="visually-hidden">
    SpecLinoは承認済み仕様とコードを中間表現（Spec IR / Code IR）に変換し、決定的な検査器（Z3）が要求ごとにVERIFIED_IN_SCOPE・VIOLATED・UNKNOWN・REVIEWの4値を反例つきで判定する。ゲートは必須要求にUNKNOWN／REVIEWが残れば失敗するフェイルクローズで、解析できないものを違反として表示しない。未解決が残ったときだけADK＋Geminiのエージェントがanalyze_focus・test_run・human_askで証拠を集めて検査器に差し戻すが、判定そのものは書き換えられない。チーム規約はSpecLinoが正本を持ち、承認フローで改訂されてゲートに反映され、MCP経由でエディタのエージェントに配信される。開発ループは、人が仕様を書きPRで承認、エージェントがMCPで仕様と規約を読んで実装、SpecLinoが検証し、違反・未検証を解消してからマージする。
  </figcaption>
</figure>

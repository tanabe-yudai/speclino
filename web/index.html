<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // React より先に .dark を付け、初回の描画でライトが一瞬見えないようにする
      // （規則は src/services/theme.ts と同じ: 保存された選択 → 無ければ OS）
      try {
        var c = localStorage.getItem('speclino.theme')
        var d = c === 'dark' || (c !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (d) document.documentElement.classList.add('dark')
      } catch (e) {
        if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')
      }
    </script>
    <title>SpecLino</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

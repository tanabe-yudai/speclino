<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // React より先に .dark を付け、初回の描画でライトが一瞬見えないようにする
      // （規則は src/services/theme.ts と同じ: 保存された選択 → 無ければ OS）
      try {
        var c = localStorage.getItem('speclino.theme')
        var d = c === 'dark' || (c !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (d) document.documentElement.classList.add('dark')
      } catch (e) {
        if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')
      }
    </script>
    <title>SpecLino</title>
    <meta name="description" content="承認した仕様と実装の「意味の差」を、検査器が反例つきで示します。テストが通っても残る違反を、PR の中で見つけます。" />
    <meta property="og:title" content="SpecLino — 仕様と実装の意味の差を、反例つきで" />
    <meta property="og:description" content="仕様はいつもの場所に。検証はエージェントと。承認した仕様と実装の意味の差を、検査器が反例つきで示します。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpecLino" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; fill: #202124; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #5f6368; }
      .zone { font-size: 18px; font-weight: 700; }
      .h { font-size: 19px; font-weight: 700; }
      .b { font-size: 15px; fill: #3c4043; }
      .s { font-size: 13px; fill: #5f6368; }
      .chip { font-size: 15px; font-weight: 700; fill: #0b5c3a; }
      .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .legend { font-size: 15px; fill: #3c4043; }
      .card { fill: #ffffff; stroke: #dadce0; stroke-width: 1; filter: url(#shadow); }
      .flow { fill: none; stroke: #5f6368; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#ffffff"/>

  <text x="48" y="66" class="title">SpecLino アーキテクチャ</text>
  <text x="48" y="100" class="subtitle">チームの知識を承認してエージェントに届け、PR ごとに守られているかを決定的に検査する</text>

  <!-- チーム -->
  <rect x="40" y="140" width="280" height="700" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="176" class="zone">チーム</text>

  <rect x="60" y="200" width="240" height="150" rx="14" class="card"/>
  <circle cx="92" cy="236" r="16" fill="#e8f0fe"/>
  <circle cx="92" cy="231" r="6" fill="#1a73e8"/>
  <path d="M81,246 a11,9 0 0 1 22,0 z" fill="#1a73e8"/>
  <text x="118" y="242" class="h">開発者・承認者</text>
  <text x="80" y="284" class="b">ブラウザで知識を</text>
  <text x="80" y="308" class="b">改訂・承認し、検査を観測</text>

  <rect x="60" y="520" width="240" height="170" rx="14" class="card"/>
  <rect x="78" y="540" width="30" height="24" rx="5" fill="#e6f4ea" stroke="#188038"/>
  <text x="84" y="558" class="s" style="fill:#188038;font-weight:700">&gt;_</text>
  <text x="118" y="560" class="h">コーディング</text>
  <text x="118" y="586" class="h">エージェント</text>
  <text x="80" y="626" class="b">Claude Code・Codex など</text>
  <text x="80" y="652" class="b">知識を読んで実装し PR を出す</text>

  <!-- Google Cloud -->
  <rect x="400" y="140" width="820" height="700" rx="18" fill="#f5f9ff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="424" y="176" class="zone" style="fill:#1a73e8">SpecLino on Google Cloud</text>

  <rect x="440" y="200" width="740" height="120" rx="14" class="card"/>
  <rect x="440" y="200" width="6" height="120" rx="3" fill="#1a73e8"/>
  <text x="466" y="238" class="h">SpecLino Web</text>
  <text x="618" y="238" class="s">Cloud Run（公開）</text>
  <text x="466" y="272" class="b">画面 ・ API ・ MCP ・ A2A ・ GitHub webhook の受付</text>
  <text x="466" y="298" class="b">知識を承認するたびに、署名つきの bundle（承認済み知識の版）を作る</text>

  <rect x="470" y="345" width="180" height="44" rx="22" fill="#ffffff" stroke="#1a73e8"/>
  <text x="560" y="373" class="b" text-anchor="middle" style="fill:#1a73e8;font-weight:700">Cloud Tasks</text>

  <rect x="440" y="420" width="450" height="220" rx="14" class="card"/>
  <rect x="440" y="420" width="6" height="220" rx="3" fill="#188038"/>
  <text x="466" y="458" class="h">Worker：決定的な検査</text>
  <text x="680" y="458" class="s">Cloud Run（非公開）</text>
  <g>
    <rect x="460" y="490" width="96" height="44" rx="10" fill="#e6f4ea"/>
    <text x="508" y="518" class="chip" text-anchor="middle">版を固定</text>
    <rect x="570" y="490" width="96" height="44" rx="10" fill="#e6f4ea"/>
    <text x="618" y="518" class="chip" text-anchor="middle">図 → IR</text>
    <rect x="680" y="490" width="96" height="44" rx="10" fill="#e6f4ea"/>
    <text x="728" y="518" class="chip" text-anchor="middle">Z3 で照合</text>
    <rect x="790" y="490" width="86" height="44" rx="10" fill="#188038"/>
    <text x="833" y="518" class="chip" text-anchor="middle" style="fill:#ffffff">ゲート</text>
    <path d="M557,512 L568,512" class="flow" marker-end="url(#arrow)"/>
    <path d="M667,512 L678,512" class="flow" marker-end="url(#arrow)"/>
    <path d="M777,512 L788,512" class="flow" marker-end="url(#arrow)"/>
  </g>
  <text x="466" y="574" class="b">仕様の図とコードの経路を数理ソルバーで照合し、</text>
  <text x="466" y="598" class="b">違反は反例つきで示す。解析できないものは通さない</text>
  <text x="466" y="622" class="s">判定は 適合 / 違反 / 未検証 / 要確認 の 4 値</text>

  <rect x="940" y="420" width="240" height="220" rx="14" fill="url(#ai)" stroke="#a78bfa" filter="url(#shadow)"/>
  <path d="M966,446 l5,12 l12,5 l-12,5 l-5,12 l-5,-12 l-12,-5 l12,-5 z" fill="#7c3aed"/>
  <text x="992" y="466" class="h">AI エージェント</text>
  <text x="962" y="498" class="s">Vertex AI（Gemini）＋ ADK</text>
  <text x="962" y="528" class="b">・仕様づくりで質問し、</text>
  <text x="962" y="549" class="b">　調べて書き換えを提案</text>
  <text x="962" y="574" class="b">・未解決なら証拠を集め、</text>
  <text x="962" y="595" class="b">　承認者に質問</text>
  <rect x="962" y="608" width="136" height="24" rx="12" fill="#ffffff" stroke="#a78bfa"/>
  <text x="1030" y="625" class="s" text-anchor="middle" style="fill:#6d28d9">判定は書き換えない</text>

  <g>
    <rect x="440" y="690" width="136" height="110" rx="12" class="card"/>
    <text x="508" y="736" class="b" text-anchor="middle" style="font-weight:700">Cloud SQL</text>
    <text x="508" y="764" class="s" text-anchor="middle">知識・判定・監査</text>
    <rect x="591" y="690" width="136" height="110" rx="12" class="card"/>
    <text x="659" y="736" class="b" text-anchor="middle" style="font-weight:700">Cloud Storage</text>
    <text x="659" y="764" class="s" text-anchor="middle">検査の成果物</text>
    <rect x="742" y="690" width="136" height="110" rx="12" class="card"/>
    <text x="810" y="736" class="b" text-anchor="middle" style="font-weight:700">Secret Manager</text>
    <text x="810" y="764" class="s" text-anchor="middle">鍵と秘密</text>
    <rect x="893" y="690" width="136" height="110" rx="12" class="card"/>
    <text x="961" y="736" class="b" text-anchor="middle" style="font-weight:700">Identity Platform</text>
    <text x="961" y="764" class="s" text-anchor="middle">ログイン</text>
    <rect x="1044" y="690" width="136" height="110" rx="12" class="card"/>
    <text x="1112" y="736" class="b" text-anchor="middle" style="font-weight:700">Sandbox</text>
    <text x="1112" y="764" class="s" text-anchor="middle">テストの隔離実行</text>
  </g>

  <!-- GitHub -->
  <rect x="1280" y="140" width="280" height="700" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
  <path d="M1312,158 a12,12 0 1 0 0.01,0 z" fill="#24292f"/>
  <text x="1334" y="176" class="zone">GitHub</text>

  <rect x="1300" y="200" width="240" height="160" rx="14" class="card"/>
  <text x="1320" y="238" class="h">リポジトリ</text>
  <text x="1320" y="274" class="b">コード</text>
  <text x="1320" y="300" class="b">配られた知識の写し</text>
  <text x="1320" y="326" class="b">署名つきの lock</text>

  <rect x="1300" y="440" width="240" height="230" rx="14" class="card"/>
  <text x="1320" y="478" class="h">Pull Request</text>
  <line x1="1316" y1="498" x2="1524" y2="498" stroke="#e5e7eb"/>
  <circle cx="1330" cy="526" r="9" fill="#1a7f37"/>
  <path d="M1325,526 l4,4 l7,-8" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="1348" y="531" class="b">単体テスト</text>
  <circle cx="1330" cy="566" r="9" fill="#cf222e"/>
  <path d="M1326,562 l8,8 M1334,562 l-8,8" stroke="#fff" stroke-width="2"/>
  <text x="1348" y="571" class="b" style="font-weight:700">SpecLino / gate</text>
  <rect x="1316" y="592" width="208" height="40" rx="8" fill="#fff8f8" stroke="#f5c2c7"/>
  <text x="1420" y="617" class="s" text-anchor="middle" style="fill:#a40e26">仕様違反 1 件（反例つき）</text>

  <!-- フロー -->
  <path d="M300,270 L438,270" class="flow" marker-end="url(#arrow)"/>
  <path d="M300,600 H370 V300 H438" class="flow" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M180,690 V880 H1420 V672" class="flow" marker-end="url(#arrow)"/>
  <path d="M1300,480 H1240 V260 H1182" class="flow" marker-end="url(#arrow)"/>
  <path d="M560,320 V343" class="flow" marker-end="url(#arrow)"/>
  <path d="M560,389 V418" class="flow" marker-end="url(#arrow)"/>
  <path d="M890,530 H938" class="flow" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M860,640 V660 H1250 V600 H1298" class="flow" marker-end="url(#arrow)"/>

  <g>
    <circle cx="370" cy="270" r="15" fill="#1a73e8"/><text x="370" y="275" class="num" text-anchor="middle">1</text>
    <circle cx="370" cy="450" r="15" fill="#1a73e8"/><text x="370" y="455" class="num" text-anchor="middle">2</text>
    <circle cx="800" cy="880" r="15" fill="#1a73e8"/><text x="800" y="885" class="num" text-anchor="middle">3</text>
    <circle cx="1240" cy="370" r="15" fill="#1a73e8"/><text x="1240" y="375" class="num" text-anchor="middle">4</text>
    <circle cx="680" cy="367" r="15" fill="#1a73e8"/><text x="680" y="372" class="num" text-anchor="middle">5</text>
    <circle cx="915" cy="560" r="15" fill="#7c3aed"/><text x="915" y="565" class="num" text-anchor="middle">6</text>
    <circle cx="1100" cy="660" r="15" fill="#188038"/><text x="1100" y="665" class="num" text-anchor="middle">7</text>
  </g>

  <!-- 凡例 -->
  <rect x="40" y="916" width="1520" height="96" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="952" class="legend"><tspan font-weight="700">1</tspan> 知識を画面で承認　<tspan font-weight="700">2</tspan> エージェントが MCP / A2A で最新の知識を取得　<tspan font-weight="700">3</tspan> 実装して PR を出す　<tspan font-weight="700">4</tspan> webhook で検査を依頼</text>
  <text x="64" y="988" class="legend"><tspan font-weight="700">5</tspan> キューから Worker が検査　<tspan font-weight="700">6</tspan> 未解決が残れば AI エージェントが証拠を集めて質問　<tspan font-weight="700">7</tspan> 結果を PR のチェックに返す（合否は決定的な検査だけが決める）</text>
</svg>
